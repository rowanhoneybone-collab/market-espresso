name: Refresh Dividend Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 1"
  push:
    branches: ["main"]
    paths:
      - "config.json"
      - "scripts/fetch_opportunities.py"
      - ".github/workflows/opportunities.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-espresso-opportunities
  cancel-in-progress: true

jobs:
  refresh-opportunities:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screener parser
        run: python -m pip install beautifulsoup4

      - name: Run Doc formula dividend screen
        continue-on-error: true
        env:
          OPPORTUNITY_WORKERS: "8"
        run: python scripts/fetch_opportunities.py

      - name: Ensure opportunity snapshot exists
        run: |
          if [ ! -f data/opportunities.json ]; then
            mkdir -p data
            python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          Path("data/opportunities.json").write_text(json.dumps({
              "generatedAt": dt.datetime.now(dt.timezone.utc).isoformat(),
              "status": "error",
              "error": "The automated data source did not return a usable screen on this run.",
              "method": "Doc's Formula for Buying Winning Stocks",
              "universe": "U.S.-listed stocks with 10+ consecutive years of dividend growth",
              "universeCount": 0,
              "screenedCount": 0,
              "quickPassCount": 0,
              "winnerCount": 0,
              "criteria": {"minConsecutiveRevenueYears":3,"minRoaPct":10,"minDividendGrowthYears":10,"maxNetDebtToEbitda":4,"maxPe":25},
              "winners": [],
              "nearMisses": []
          }, indent=2))
          PY
          fi

      - name: Save opportunity snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if git diff --cached --quiet; then
            echo "Opportunity snapshot is unchanged."
          else
            git commit -m "Refresh dividend opportunities"
            git push
          fi

      - name: Fetch fresh market data for this edition
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Market Espresso site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
