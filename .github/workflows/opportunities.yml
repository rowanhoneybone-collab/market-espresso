name: Refresh Dividend Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 1"
  push:
    branches: ["main"]
    paths:
      - "config.json"
      - "scripts/fetch_opportunities.py"
      - ".github/workflows/opportunities.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-espresso-opportunities
  cancel-in-progress: true

jobs:
  refresh-opportunities:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screener parser
        run: python -m pip install beautifulsoup4

      - name: Run Doc formula dividend screen
        env:
          OPPORTUNITY_WORKERS: "6"
        run: python scripts/fetch_opportunities.py

      - name: Save opportunity snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if git diff --cached --quiet; then
            echo "Opportunity snapshot is unchanged."
          else
            git commit -m "Refresh dividend opportunities"
            git push
          fi

      - name: Fetch fresh market data for this edition
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Market Espresso site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
